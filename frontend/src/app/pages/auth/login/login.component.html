<div class="login-container">
    <h2>Iniciar Sesión</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          placeholder="tu@email.com"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">
            El email es requerido
          </span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">
            Ingresa un email válido
          </span>
        </div>
      </div>
  
      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          La contraseña es requerida
        </div>
      </div>
  
      <!-- Mensaje de error general -->
      <div *ngIf="errorMessage" class="error-message server-error">
        {{ errorMessage }}
      </div>
  
      <!-- Botón de submit -->
      <button type="submit" [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="!isLoading">Ingresar</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>
  
      <!-- Enlaces -->
      <div class="footer-links">
        <a routerLink="/auth/register">¿No tienes cuenta? Regístrate</a>
        <a routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
